[package]
name = "nexoscli-plugin-replay"
version = "0.1.0"
edition = "2021"

[dependencies]
nexoscli-core = { path = "../../nexoscli-core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
clap = "4.5"
time = { workspace = true }
walkdir = { workspace = true }
tar = { workspace = true }
flate2 = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
jsonschema = "0.17"
csv = "1.3"
