[package]
name = "nexoscli-plugin-cline"
version = "0.1.0"
edition = "2021"

[dependencies]
nexoscli-core = { path = "../../nexoscli-core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
walkdir = "2"
time = { version = "0.3", features = ["parsing", "formatting"] }
dirs = "5"
sha2 = "0.10"
clap = "4.5"
regex = { workspace = true }
spin_sleep = "1"
