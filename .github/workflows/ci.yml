name: CI
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: NEXOS_TEST_EXPORT_LOGS=1 cargo test --workspace
      - name: Docs drift gate (CLI_REFERENCE.md and commands.json)
        run: |
          cargo run --quiet --bin nexoscli -- dev docs commands --out-md docs/CLI_REFERENCE.md --out-json docs/catalog/commands.json --apply-readmes
          git add -A
          git diff --cached --quiet
      - name: Validate commands.json against JSON Schema
        run: |
          python -m pip install --user jsonschema
          python - <<'PY'
          import json
          from jsonschema import validate, Draft7Validator
          with open('docs/catalog/commands.json') as f:
              data = json.load(f)
          with open('docs/catalog/schema/commands_catalog.schema.json') as f:
              schema = json.load(f)
          Draft7Validator.check_schema(schema)
          validate(instance=data, schema=schema)
          print("Schema validation OK")
          PY
      - name: Install ripgrep (rg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Check enforcement lists present
        run: |
          test -f .nexoscli/migrated/args.txt && test -f .nexoscli/allow/argmatches.txt

      - name: Ensure plugin README commands AUTO blocks present
        run: |
          cargo run --quiet --bin nexoscli -- dev docs commands --apply-readmes
          COUNT=$(rg -n --glob "plugins/*/README.md" "<!-- BEGIN: AUTO (id=commands) -->" | wc -l)
          echo "Found AUTO blocks: $COUNT"
          test "$COUNT" -ge 1

      - name: Enforce plugin structure (strict)
        run: |
          cargo run --quiet --bin nexoscli -- dev plugins check --strict --output json

      - name: Enforce args dual-derive and parsing bans
        run: |
          cargo run --quiet --bin nexoscli -- dev repo args-enforce --migrated .nexoscli/migrated/args.txt --allow-list .nexoscli/allow/argmatches.txt --output json

      - name: Upload test event logs
        uses: actions/upload-artifact@v4
        with:
          name: nexos-test-events
          path: target/test-logs
