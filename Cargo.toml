[workspace]
members = ["nexoscli-core","nexoscli-bin","plugins/issue"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
authors = ["You"]

[workspace.dependencies]
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter","fmt","json"] }
uuid = { version = "1.8", features = ["v4","serde"] }
time = { version = "0.3", features = ["macros","formatting","parsing","serde-well-known"] }
dirs = "5.0"

# test deps (workspace-scoped)
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.10"
